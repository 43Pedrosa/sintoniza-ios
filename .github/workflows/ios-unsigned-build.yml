name: Build Sintoniza iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unsigned-build.yml'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select and verify Xcode 26.2
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.2.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/RadioPlayer.xcodeproj \
            -scheme RadioPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/RadioPlayer.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/Sintoniza.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Sintoniza-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sintoniza-iOS-26.2-unsigned-IPA
          path: Sintoniza-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
