name: RadioPlayer
options:
  bundleIdPrefix: com.sintoniza
  deploymentTarget:
    iOS: "26.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RadioPlayer:
    type: application
    platform: iOS
    sources:
      - path: RadioPlayer
    settings:
      base:
        INFOPLIST_FILE: RadioPlayer/Configuration/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.sintoniza.radioplayer
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: RadioPlayer/Configuration/Info.plist
      properties:
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
